name: Build PHK Independent Dock
on:
  push:
    paths:
      - 'PHKIndependent/**'
      - '.github/workflows/phk-independent.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  arm64:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Test portable C++17 navigation and commands
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic \
            PHKIndependent/Core/PHKCore.cpp PHKIndependent/Tests/core_test.cpp \
            -o /tmp/phk-independent-test
          /tmp/phk-independent-test
      - name: Verify Mach-O missing-library diagnostics
        run: python3 -m unittest discover -s PHKIndependent/Tests -p 'test_*.py' -v
      - name: Build unsigned native iOS ARM64 dylib
        shell: bash
        run: |
          set -euo pipefail
          SDK="$(xcrun --sdk iphoneos --show-sdk-path)"
          mkdir -p output
          for source in PHKIndependent/Sources/*.mm; do
            object="output/$(basename "$source" .mm).o"
            xcrun --sdk iphoneos clang++ -std=c++17 -arch arm64 \
              -isysroot "$SDK" -miphoneos-version-min=15.1 \
              -O2 -fobjc-arc -fblocks -fobjc-exceptions -fvisibility=hidden \
              -fstack-protector-strong -c "$source" -o "$object"
          done
          xcrun --sdk iphoneos clang++ -std=c++17 -arch arm64 \
            -isysroot "$SDK" -miphoneos-version-min=15.1 \
            -O2 -fvisibility=hidden -fstack-protector-strong -c \
            PHKIndependent/Core/PHKCore.cpp -o output/PHKIndependent-core.o
          xcrun --sdk iphoneos clang++ -arch arm64 -dynamiclib \
            -isysroot "$SDK" -miphoneos-version-min=15.1 \
            -install_name '@rpath/PHKIndependent.dylib' \
            output/*.o \
            -framework UIKit -framework Foundation -framework QuartzCore \
            -framework CoreGraphics -framework UniformTypeIdentifiers \
            -o output/PHKIndependent.dylib
          # Strip local symbols from our library only; exported integration APIs remain.
          xcrun --sdk iphoneos strip -x output/PHKIndependent.dylib
          xcrun nm -gU output/PHKIndependent.dylib | grep -q '_PHKIndependentVersion'
          xcrun nm -gU output/PHKIndependent.dylib | grep -q '_PHKIndependentShowMenu'
          xcrun nm -gU output/PHKIndependent.dylib | grep -q '_PHKIndependentStickerPNG'
          xcrun nm -gU output/PHKIndependent.dylib | grep -q '_PHKIndependentSchedule'
          xcrun nm -gU output/PHKIndependent.dylib | grep -q '_PHKIndependentRegisterSender'
          xcrun nm -gU output/PHKIndependent.dylib | grep -q '_PHKIndependentSendTo'
          xcrun nm -gU output/PHKIndependent.dylib | grep -q '_PHKIndependentCancelPending'
          if xcrun otool -L output/PHKIndependent.dylib | grep -q 'ZaloModVIP'; then
            echo "Unexpected dependency on original ZaloModVIP dylib"
            exit 1
          fi
          file output/PHKIndependent.dylib
          xcrun vtool -show-build output/PHKIndependent.dylib || true
      - uses: actions/upload-artifact@v4
        with:
          name: PHKIndependent-arm64-unsigned-dylib
          path: output/PHKIndependent.dylib
          if-no-files-found: error

