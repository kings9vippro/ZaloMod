name: Build iOS UI Demo
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  ios-build:
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate distinct PHK icon set from project photo
        run: |
          swift scripts/generate_phk_icons.swift \
            iOS/Resources/Assets.xcassets/AdminCar.imageset/admin-car.jpg \
            iOS/Resources/Assets.xcassets/AppIcon.appiconset
          python3 scripts/validate_phk_icons.py \
            iOS/Resources/Assets.xcassets/AppIcon.appiconset
      - name: Generate Xcode project
        run: xcodegen generate --spec project.yml
      - name: Verify C++ core
        run: |
          clang++ -std=c++17 -Wall -Wextra -Werror -pedantic Core/Settings.cpp Core/tests/settings_test.cpp -o /tmp/phk_core_tests
          /tmp/phk_core_tests
      - name: Build iOS simulator app (unsigned)
        run: |
          xcodebuild -project PHKControl.xcodeproj -scheme PHKControl -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
      - name: Build unsigned iOS device app
        run: |
          xcodebuild -project PHKControl.xcodeproj -scheme PHKControl -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build-device CODE_SIGNING_ALLOWED=NO build
      - name: Package UNSIGNED IPA (not installable until signed)
        shell: bash
        run: |
          mkdir -p out/Payload
          cp -R build-device/Build/Products/Release-iphoneos/PHKControl.app out/Payload/
          cd out && zip -qr PHKControl-UNSIGNED.ipa Payload
      - name: Validate unsigned IPA structure
        shell: bash
        run: |
          unzip -tq out/PHKControl-UNSIGNED.ipa
          unzip -Z1 out/PHKControl-UNSIGNED.ipa | grep -q 'Payload/PHKControl.app/Info.plist'
          xcrun --sdk iphoneos lipo -info build-device/Build/Products/Release-iphoneos/PHKControl.app/PHKControl | grep -q arm64
          if unzip -Z1 out/PHKControl-UNSIGNED.ipa | grep -Fq 'PHKStandalone.dylib'; then
            echo 'ERROR: Independent native IPA should not package the injected standalone dylib.' >&2
            exit 1
          fi
          if xcrun otool -L build-device/Build/Products/Release-iphoneos/PHKControl.app/PHKControl | grep -Fq 'PHKStandalone.dylib'; then
            echo 'ERROR: Native application unexpectedly links a tweak dylib.' >&2
            exit 1
          fi
          echo 'Verified: native iOS app binary; no PHKStandalone dylib dependency.'
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: PHKControl-unsigned-ipa
          path: out/PHKControl-UNSIGNED.ipa
          if-no-files-found: error
